<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>Lista de tarefas</title>
    <link rel="stylesheet" href="style.css">
    <script src="./main.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-slate-900 to-slate-800 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-xl bg-white/10 border border-white/10 backdrop-blur-lg rounded-3xl shadow-2xl p-8 flex flex-col gap-6">
        <h1 class="text-white text-4xl font-bold text-center">Lista de tarefas</h1>
        <form class="w-full flex gap-3">
            <input class="flex-1 px-4 py-3 rounded-xl bg-slate-100 text-black outline-none focus:ring-4 focus:ring-blue-500/40 transition"
            type="text"
            placeholder="Adicione sua tarefa"/>
            <button class="bg-blue-600 hover:bg-blue-700 active:scale-95 transition px-6 py-3 rounded-xl text-white font-semibold shadow-lg flex items-center gap-2">           <span class="material-symbols-outlined"></span>Adicionar</button>
        </form>
    <ul class="w-full text-white flex flex-col gap-4"id="tarefas"></ul>
   </div>
</body>
</html>
